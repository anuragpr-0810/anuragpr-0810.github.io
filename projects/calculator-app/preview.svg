<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Prism Calculator preview</title><desc id="desc">Dark glass scientific calculator with purple and cyan controls</desc><defs><linearGradient id="g"><stop stop-color="#a87bff"/><stop offset="1" stop-color="#62e8ed"/></linearGradient></defs><rect width="800" height="500" rx="28" fill="#0b0b17"/><circle cx="80" cy="30" r="210" fill="#662e9b" opacity=".15"/><rect x="240" y="32" width="320" height="436" rx="28" fill="#191a30" stroke="#4b4d70"/><text x="272" y="75" fill="#f4f4ff" font-family="Arial" font-size="16" font-weight="bold">◈ PRISM CALCULATOR</text><text x="520" y="160" fill="#a6a8c4" text-anchor="end" font-family="monospace" font-size="18">sin(30) + 2</text><text x="520" y="213" fill="#f4f4ff" text-anchor="end" font-family="monospace" font-size="46">2.5</text><g font-family="Arial" text-anchor="middle" font-size="18" fill="#f4f4ff"><g fill="#25263c"><rect x="270" y="240" width="56" height="52" rx="13"/><rect x="335" y="240" width="56" height="52" rx="13"/><rect x="400" y="240" width="56" height="52" rx="13"/></g><text x="298" y="273">AC</text><text x="363" y="273">DEL</text><text x="428" y="273">%</text><g fill="#22213c"><rect x="465" y="240" width="56" height="52" rx="13"/><rect x="270" y="303" width="56" height="52" rx="13"/><rect x="335" y="303" width="56" height="52" rx="13"/><rect x="400" y="303" width="56" height="52" rx="13"/><rect x="465" y="303" width="56" height="52" rx="13"/><rect x="270" y="366" width="56" height="52" rx="13"/><rect x="335" y="366" width="56" height="52" rx="13"/><rect x="400" y="366" width="56" height="52" rx="13"/></g><rect x="465" y="303" width="56" height="115" rx="13" fill="url(#g)"/><text x="493" y="273" fill="#bba0ff">÷</text><text x="298" y="337">7</text><text x="363" y="337">8</text><text x="428" y="337">9</text><text x="493" y="337" fill="#111126">=</text><text x="298" y="400">4</text><text x="363" y="400">5