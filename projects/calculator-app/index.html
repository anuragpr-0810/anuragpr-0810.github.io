<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Calculator | Anurag Kumar</title>
<meta name="description" content="A scientific calculator with history, keyboard input and dark/light mode, built with HTML, CSS and JavaScript.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Smart Calculator</h1>
    <div class="tools">
      <button id="sci" class="pill" aria-pressed="false">Scientific</button>
      <button id="deg" class="pill" aria-label="Angle unit: degrees">DEG</button>
      <button id="theme" class="pill" aria-label="Switch light or dark theme">Theme</button>
    </div>
  </header>
  <div class="layout">
    <section class="calc glass" aria-label="Calculator">
      <output id="expr" class="expr"></output>
      <output id="res" class="res" aria-live="polite">0</output>
      <div id="sciKeys" class="keys sci-keys" hidden></div>
      <div id="keys" class="keys"></div>
    </section>
    <aside class="hist glass" aria-label="Calculation history">
      <div class="hh"><h2>History</h2><button id="clearHist" class="pill">Clear</button></div>
      <ul id="list"></ul>
    </aside>
  </div>
  <p class="hint">Keyboard: digits, + − * / ^ ( ) % ! . &nbsp;·&nbsp; Enter = equals &nbsp;·&nbsp; Backspace = delete &nbsp;·&nbsp; Esc = clear</p>
  <p class="hint"><a href="../../index.html">← Back to portfolio</a></p>
</main>
<script src="script.js"></script>
</body>
</html>
